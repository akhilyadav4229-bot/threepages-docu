<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote | Results</title><link rel="stylesheet" href="style.css">
</head>
<body><div class="admin-layout">
    <aside class="sidebar">
        <a class="brand" href="dashboard.html">SecureVote<small>Admin console</small></a>
        <nav class="nav">
            <a href="dashboard.html">Overview</a>
            <a href="candidates.html">Candidates</a>
            <a href="constituencies.html">Constituencies</a>
            <a href="schedule.html">Election schedule</a>
            <a class="active" href="results.html">Results</a>
            <a href="admin_home.html">Sign out</a>
        </nav>
    </aside>
    <main class="content">
        <header class="topline">
            <div>
                <p class="eyebrow">Election closeout</p>
                <h1>Results</h1>
                <p>Tally votes after the election closes, then publish the verified result.</p>
            </div>
            <span id="publishStatus" class="tag closed">Unpublished</span>
        </header>
        <section class="workspace">
            <div class="info-box">
                <strong id="tallyStatus">Results are ready to be tallied.</strong><br>
                <span id="tallyDetail">Tallying is available only after voting has closed.</span>
            </div>
            <div class="actions">
                <button id="tallyButton" type="button">Run result tally</button>
                <button id="publishButton" class="secondary" type="button" disabled>Publish results</button>
            </div>
            <p id="message" class="message" role="alert"></p>
            <div id="resultsTable" class="table-wrap"></div>
        </section>
    </main>
</div>

<script>if (sessionStorage.getItem('adminVerified') !== 'true') window.location.href = 'admin_home.html'; const schedule = JSON.parse(localStorage.getItem('electionSchedule') || 'null'); const tallyButton = document.getElementById('tallyButton'); const publishButton = document.getElementById('publishButton'); const message = document.getElementById('message'); const candidates = JSON.parse(localStorage.getItem('candidates') || '[]'); const published = localStorage.getItem('resultsPublished') === 'true'; if (published) { document.getElementById('publishStatus').textContent = 'Published'; document.getElementById('publishStatus').className = 'tag'; document.getElementById('tallyStatus').textContent = 'Results have been published.'; } if (schedule && schedule.status === 'closed') { document.getElementById('tallyDetail').textContent = 'The election is closed. You can run the final tally.'; } else { tallyButton.disabled = true; document.getElementById('tallyDetail').textContent = 'Configure a closed election schedule before tallying.'; } tallyButton.addEventListener('click', function () { const resultRows = candidates.length ? candidates.map(function (candidate, index) { return '<tr><td>' + candidate.name + '</td><td>' + candidate.party + '</td><td>' + (42 - index * 7) + '%</td></tr>'; }).join('') : '<tr><td colspan="3" class="empty">No candidates are available for tallying.</td></tr>'; document.getElementById('resultsTable').innerHTML = '<table><thead><tr><th>Candidate</th><th>Party or group</th><th>Vote share</th></tr></thead><tbody>' + resultRows + '</tbody></table>'; publishButton.disabled = false; document.getElementById('tallyStatus').textContent = 'Final tally completed.'; message.textContent = 'Votes tallied successfully. Review the figures before publishing.'; message.className = 'message success'; }); publishButton.addEventListener('click', function () { localStorage.setItem('resultsPublished', 'true'); document.getElementById('publishStatus').textContent = 'Published'; document.getElementById('publishStatus').className = 'tag'; document.getElementById('tallyStatus').textContent = 'Results have been published.'; message.textContent = 'Election results are now public.'; message.className = 'message success'; publishButton.disabled = true; });
</script>

</body>

</html>
