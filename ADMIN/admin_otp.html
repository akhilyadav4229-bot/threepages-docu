<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote | Verify admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell narrow-shell">
        <section class="card">
            <p class="eyebrow">SecureVote administration</p>
            <h1>Verify your device</h1>
            <p class="intro">Enter the six-digit OTP sent to the registered administrator device.</p>
            <div class="info-box">
                Your OTP for verification is <strong id="displayOtp">Generating...</strong>. Keep it private and do not share it.
            </div>
            <form id="otpForm" class="form-grid">
                <label for="otp">One-time password</label>
                <input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Enter 6-digit OTP">
                <button type="submit">Verify and open dashboard</button>
                <p id="otpMessage" class="message" role="alert"></p>
            </form>
            <a class="secondary-link" href="admin_home.html">Back to admin login</a>
        </section>
    </main>
    <script>
        const otp = sessionStorage.getItem('adminOtp');
        if (otp) {
            document.getElementById('displayOtp').textContent = otp;
        } else {
            document.getElementById('displayOtp').textContent = 'Not available';
        }
        document.getElementById('otpForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const message = document.getElementById('otpMessage');
            if (!otp || document.getElementById('otp').value.trim() !== otp) {
                message.textContent = 'That OTP is incorrect. Please try again.';
                message.className = 'message error';
                return;
            }
            sessionStorage.setItem('adminVerified', 'true');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
