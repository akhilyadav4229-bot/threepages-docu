<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote | Admin registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><main class="page-shell narrow-shell">
    <section class="card"><p class="eyebrow">SecureVote administration</p>
        <h1>Register officer</h1><p class="intro">Create an administrator profile using the details issued by the election commission.</p>
<form id="registrationForm" class="form-grid">
    <label for="phone">Phone number</label>
    <input id="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit phone number" required>
    <label for="officerId">Election officer ID</label>
    <input id="officerId" required placeholder="Example: EO-2048">
    <label for="dob">Date of birth</label>
    <input id="dob" type="date" required>
    <label for="password">Create password</label>
    <input id="password" type="password" minlength="8" required placeholder="At least 8 characters">
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" minlength="8" required placeholder="Re-enter password">
    <button type="submit">Create admin profile</button>
    <p id="registrationMessage" class="message" role="alert"></p>
</form>
<div class="info-box">Use the election officer ID as your Admin ID when signing in.</div>
<a class="secondary-link" href="admin_home.html">Already registered? Sign in</a>
</section>
</main>
<script>
    const dob = document.getElementById('dob');
    dob.max = new Date().toISOString().split('T')[0];
    document.getElementById('registrationForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const message = document.getElementById('registrationMessage');
        const phone = document.getElementById('phone').value.trim();
        const officerId = document.getElementById('officerId').value.trim();
        const birthDate = document.getElementById('dob').value;
        const password = document.getElementById('password').value;
        const confirmation = document.getElementById('confirmPassword').value;

        if (!/^[0-9]{10}$/.test(phone)) {
            message.textContent = 'Enter a valid 10-digit phone number.';
            message.className = 'message error';
            return;
        }

        if (new Date(birthDate) >= new Date()) {
            message.textContent = 'Date of birth must be in the past.';
            message.className = 'message error';
            return;
        }

        if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])/.test(password)) {
            message.textContent = 'Password must include uppercase, lowercase, and a number.';
            message.className = 'message error';
            return;
        }

        if (password !== confirmation) {
            message.textContent = 'Passwords do not match.';
            message.className = 'message error';
            return;
        }

        localStorage.setItem('adminRegistration', JSON.stringify({
            phone: phone,
            officerId: officerId,
            dateOfBirth: birthDate,
            password: password
        }));

        message.textContent = 'Registration complete. You can now sign in with your officer ID.';
        message.className = 'message success';
        this.reset();
    });
</script>
</body>
</html>
