<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVote | Voter Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell narrow-shell">
    <section class="card">
      <p class="eyebrow">SecureVote</p>
      <h1>Voter registration</h1>
      <p class="intro">Register with your Aadhaar number. After registration, the last six digits of your Aadhaar number will be your Voter ID and your date of birth will be your password.</p>

      <form id="registerForm" class="form-grid">
        <label for="aadhaar">Aadhaar card number</label>
        <input id="aadhaar" name="aadhaar" type="text" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" placeholder="Enter 12-digit Aadhaar number" required>

        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="date" required>

        <button type="submit">Complete registration</button>
        <p id="registerMessage" class="message" role="alert"></p>
      </form>

      <a class="secondary-link" href="home.html">Already registered? Go to login</a>
    </section>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const aadhaar = document.getElementById('aadhaar').value.trim();
      const dob = document.getElementById('dob').value;
      const message = document.getElementById('registerMessage');

      if (!/^\d{12}$/.test(aadhaar)) {
        message.textContent = 'Aadhaar number must contain exactly 12 digits.';
        message.className = 'message error';
        return;
      }

      const voterId = aadhaar.slice(-6);
      const registeredVoters = JSON.parse(localStorage.getItem('registeredVoters') || '{}');
      if (registeredVoters[voterId]) {
        message.textContent = 'This Aadhaar number is already registered.';
        message.className = 'message error';
        return;
      }

      registeredVoters[voterId] = {
        password: dob,
        contact: 'your registered contact',
        hasVoted: false
      };
      localStorage.setItem('registeredVoters', JSON.stringify(registeredVoters));
      message.textContent = 'Registration successful. Your Voter ID is ' + voterId + '. Redirecting to login...';
      message.className = 'message success';
      setTimeout(function () { window.location.href = 'home.html'; }, 900);
    });
  </script>
</body>
</html>
