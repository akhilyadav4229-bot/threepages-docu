<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVote | Ballot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell narrow-shell">
    <section class="card">
      <div class="topline"><p class="eyebrow">Step 3 of 4</p><strong id="voterLabel"></strong></div>
      <h1>Cast your vote</h1>
      <p class="intro">Select one candidate. Your choice cannot be changed after confirmation.</p>
      <form id="ballotForm" class="form-grid">
        <label class="option"><input type="radio" name="candidate" value="Candidate A" required> Candidate A</label>
        <label class="option"><input type="radio" name="candidate" value="Candidate B"> Candidate B</label>
        <label class="option"><input type="radio" name="candidate" value="Candidate C"> Candidate C</label>
        <button type="submit">Confirm selection</button>
      </form>
    </section>
  </main>
  <script>
    if (sessionStorage.getItem('otpVerified') !== 'true') window.location.href = 'home.html';
    document.getElementById('voterLabel').textContent = sessionStorage.getItem('voterId') || '';
    document.getElementById('ballotForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const candidate = new FormData(event.target).get('candidate');
      const voterId = sessionStorage.getItem('voterId');
      const receiptCode = 'SV-' + Math.random().toString(36).slice(2, 10).toUpperCase();
      const encryptedVote = btoa(JSON.stringify({ voterId: voterId, candidate: candidate, recordedAt: new Date().toISOString() }));
      localStorage.setItem('vote_' + voterId, encryptedVote);
      localStorage.setItem('voted_' + voterId, 'true');
      sessionStorage.setItem('receiptCode', receiptCode);
      sessionStorage.setItem('candidate', candidate);
      window.location.href = 'confirmation.html';
    });
  </script>
</body>
</html>
