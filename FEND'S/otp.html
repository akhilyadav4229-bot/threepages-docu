<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVote | Verify OTP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell narrow-shell">
    <section class="card">
      <p class="eyebrow">Step 2 of 4</p>
      <h1>Verify your OTP</h1>
      <p class="intro">A one-time password was sent to the registered contact <strong id="contact"></strong>.</p>
      <div class="info-box">Your OTP for verification is <strong id="displayOtp">Generating...</strong>. It is valid for 5 minutes.</div>
      <form id="otpForm" class="form-grid">
        <label for="otp">One-time password</label>
        <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" required>
        <button type="submit">Verify OTP</button>
        <p id="otpMessage" class="message" role="alert"></p>
      </form>
    </section>
  </main>
  <script>
    const created = Number(sessionStorage.getItem('otpCreated'));
    const otp = sessionStorage.getItem('otp');
    if (!otp || !created) window.location.href = 'home.html';
    document.getElementById('contact').textContent = sessionStorage.getItem('contact') || 'your registered contact';
    document.getElementById('displayOtp').textContent = otp;
    document.getElementById('otpForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const message = document.getElementById('otpMessage');
      if (Date.now() - created > 5 * 60 * 1000) {
        message.textContent = 'This OTP has expired. Please return to login.';
        message.className = 'message error';
      } else if (document.getElementById('otp').value.trim() !== otp) {
        message.textContent = 'Incorrect OTP. Please try again.';
        message.className = 'message error';
      } else {
        sessionStorage.setItem('otpVerified', 'true');
        window.location.href = 'ballot.html';
      }
    });
  </script>
</body>
</html>
