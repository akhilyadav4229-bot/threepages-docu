<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVote | Confirmation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell narrow-shell">
    <section class="card">
      <p class="eyebrow">Step 4 of 4</p>
      <h1>Vote recorded</h1>
      <p class="intro">Your vote for <strong id="candidate"></strong> has been encrypted and recorded successfully.</p>
      <div class="receipt"><small>Receipt code</small><br><strong id="receipt"></strong></div>
      <p class="message success">Your voter status has been updated. Keep this receipt code for your records.</p>
      <a class="secondary-link" href="home.html">Return to login</a>
    </section>
  </main>
  <script>
    document.getElementById('candidate').textContent = sessionStorage.getItem('candidate') || 'your selected candidate';
    document.getElementById('receipt').textContent = sessionStorage.getItem('receiptCode') || 'Unavailable';
    sessionStorage.clear();
  </script>
</body>
</html>
