<html>
<head>
<title> Ecom Application using CSS </title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-size;
}

body{
margin:0;
background-color:white;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fx);
grid-template-areas:
        "header header header header"
 	"menu menu menu menu"
	"banner banner banner banner"
	"title title title title"
	"products products products products"
	"offer offer offer offer"
	"services services services services"
	"footer footer footer footer"
}

.header{
grid-area:header;
display:grid;
grid-template-columns:20% 60% 20%;
background-color:blue;
align-items:center;
}
.logo{
	align-items:center;
}
.logo img{
	width:250px;
	height:150px;
	align-items:center;
}
.search{
	align-items:center;
}

.search input[type=text]{
width:280;
height:40;
text-align:center;
}
.search input[type=submit]{
width:80;
height:40;
}
.account{
align-items: center;
}
</style>
</head>

<body>
<div class="container">
<header class="header">
<div class="logo"><img src="logo1.avif" alt="company-logo"/></div>
<div class="search">
<input type="text" placeholder="Search items"/>
<input type="submit" value="search"/>
</div>
<div class="account"><b>Login</b>|<b>register</b>|<b>Cart</b></div>
</header>
<nav class="menu">
	<div>Fashion</div>
	<div>Groceries</div>
	<div>Electonics</div>
	<div>Moblies</div>
	<div>Applications</div>
	<div>Beauty</div>
</nav>
</div>
</body>
</html>
