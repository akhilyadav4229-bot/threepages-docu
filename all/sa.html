<html>
<head>
<title>JavaScript Demo Page</title>
</head>
<body>
<h2>Initial scripting</h2>
<br/>
<br/>
<label>A=</label><input type="text" placeholder="enter the value" id ="text1">
<br/>
<label>B=</label>
<input type="text" placeholder="enter the value" id ="text2">
<br/>
<br/>
<button type="button" onclick="add()">+</button>&nbsp&nbsp
<button type="button" onclick="sub()">-</button>&nbsp&nbsp
<button type="button" onclick="mul()">*</button>&nbsp&nbsp
<button type="button" onclick="div()">/</button>&nbsp&nbsp
<br/><br/>

<button type="button" onclick="fun1()">CLICK ME</button>
<p id="demo1"></p>

<script>
var op;
function add(){
	op = "+";
}
function sub(){
	op = "-";
}
function mul(){
	op = "*";
}
function div(){
	op = "/";
}
function fun1() {
var a=parseInt(document.getElementById('text1').value);
var b=parseInt(document.getElementById('text2').value);
var c;
if(op == "+"){
	c = a + b;
}
if(op == "-"){
	c = a - b;
}
if(op == "*"){
	c = a * b;
}
if(op == "/"){
	c = a / b;
}
  document.getElementById('demo1').innerHTML = ''+c;
}
</script>
</body>
</html>
