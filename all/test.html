<html>
<head>
<title>interaction Counter</title>
<style>
body{
margin : 0;
background-color: pink;
text-align: center;
}
.inc { background-color: green; color: white; }
.dec { background-color: red; color: white; }
.reset { background-color: black; color: white;}

</style>

</head>
<body>
<h2>Interactive Counter</h2>
<div id="counter">0</div>

<button class="dec" onclick="decre()">-1</button>
<button class="reset" onclick="resetup()">RESET</button>
<button class="inc" onclick="incre()">+1</button>
<br><br>



<script>
let c = 0;
const counter = document.getElementById("counter");

function incre(){
c++;
counter.innerText = c;
}

function decre(){
c--;
counter.innerText = c;
}

function resetup(){
c = 0;
counter.innerText = c;
}
</script>

</body>
</html>
