<!DOCTYPE html>
<html>
<head>
  <title>Interactive Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f4f4f9;
    }
    #counter {
      font-size: 40px;
      margin: 20px;
      color: #333;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.8;
    }
    .inc { background-color: #4CAF50; color: white; }
    .dec { background-color: #f44336; color: white; }
    .reset { background-color: #2196F3; color: white; }
  </style>
</head>
<body>
  <h2>Interactive Counter</h2>
  <div id="counter">0</div>
  
  <button class="inc" onclick="increment()">+1</button>
  <button class="dec" onclick="decrement()">-1</button>
  <button class="reset" onclick="resetCounter()">Reset</button>

  <script>
    let count = 0;
    const counter = document.getElementById("counter");

    function increment() {
      count++;
      counter.innerText = count;
    }

    function decrement() {
      count--;
      counter.innerText = count;
    }

    function resetCounter() {
      count = 0;
      counter.innerText = count;
    }
  </script>
</body>
</html>
